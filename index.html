<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glossaire des Termes Islamiques</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-start: #fdfbf8; /* A very light, warm off-white */
            --bg-mid: #fbf8f3; /* A soft, sandy beige */
            --bg-end: #ffffff;
            --text-primary: #312e2b; /* A deep, warm charcoal */
            --text-secondary: #6b6660; /* A softer, warm gray */
            --text-title: #b48f5a; /* A muted, sophisticated gold/ochre */
            --accent: #cda776; /* A slightly brighter gold for highlights */
            --accent-dark: #b48f5a;
            --glass-bg: rgba(255, 255, 255, 0.5);
            --glass-border: rgba(255, 255, 255, 0.4);
            --shadow-color: rgba(180, 143, 90, 0.1); /* Shadow based on the accent color */
            --scroll-track: #fbf8f3;
            --scroll-thumb: #d9b88a;
            --scroll-thumb-hover: #b48f5a;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(165deg, var(--bg-start), var(--bg-mid), var(--bg-end));
            background-size: 200% 200%;
            animation: gradientBG 20s ease infinite;
            color: var(--text-primary);
            transition: background 0.5s ease;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .arabic-term { font-family: 'Amiri', serif; color: var(--text-secondary); }
        .title-text { color: var(--text-title); }
        .secondary-text { color: var(--text-secondary); }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
        }
        
        .search-bar-wrapper.glass-card { background: var(--glass-bg); }

        .term-card:hover {
            transform: translateY(-10px) scale(1.03);
            box-shadow: 0 25px 50px -12px var(--shadow-color), 0 0 0 1px var(--accent);
            border-color: transparent;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--scroll-track); }
        ::-webkit-scrollbar-thumb { background: var(--scroll-thumb); border-radius: 10px; border: 2px solid var(--scroll-track); }
        ::-webkit-scrollbar-thumb:hover { background: var(--scroll-thumb-hover); }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(25px); } to { opacity: 1; transform: translateY(0); } }

        .fade-in { animation: fadeIn 1s ease-out forwards; }
        .slide-up { animation: slideUp 0.8s cubic-bezier(0.165, 0.84, 0.44, 1) forwards; opacity: 0; }
        
        .term-card {
            opacity: 0;
            animation: slideUp 0.6s cubic-bezier(0.165, 0.84, 0.44, 1) forwards;
        }
        
        #back-to-top {
            display: none; opacity: 0;
            transition: opacity 0.3s ease, transform 0.3s ease;
        }
        
        /* Styles pour le modal */
        #term-modal { display: none; }
        #term-modal.active { display: flex; }
    </style>
</head>
<body>

    <div class="container mx-auto p-4 md:p-8 max-w-4xl min-h-screen">

        <header class="relative text-center mb-10 fade-in">
            <h1 class="text-4xl md:text-5xl font-bold title-text mb-2" style="text-shadow: 1px 1px 2px rgba(0,0,0,0.05);">Glossaire Islamique</h1>
            <p class="text-lg secondary-text">Explorez les termes clés de l'Islam (Ahl as-Sunnah wa'l-Jamā'ah)</p>
        </header>
        
        <div class="text-center mb-8 slide-up" style="animation-delay: 0.05s;">
             <button id="random-term-btn" class="bg-[var(--accent)] hover:bg-[var(--accent-dark)] text-white font-bold py-2 px-4 rounded-full transition-all duration-300 transform hover:scale-105">
                <i class="fas fa-random mr-2"></i>Terme au Hasard
            </button>
        </div>


        <div class="mb-8 sticky top-4 z-10 slide-up" style="animation-delay: 0.1s;">
            <div class="relative search-bar-wrapper glass-card rounded-2xl shadow-xl">
                <div class="absolute inset-y-0 left-0 pl-5 flex items-center pointer-events-none"><svg class="h-5 w-5 secondary-text" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M8 4a4 4 0 100 8 4 4 0 000-8zM2 8a6 6 0 1110.89 3.476l4.817 4.817a1 1 0 01-1.414 1.414l-4.816-4.816A6 6 0 012 8z" clip-rule="evenodd" /></svg></div>
                <input type="text" id="searchInput" placeholder="Rechercher (ex: Tawakkul, Fiqh...)" class="w-full p-4 pl-14 bg-transparent border-none rounded-2xl focus:ring-2 focus:ring-inset focus:ring-[var(--accent)] text-lg transition-shadow duration-300">
            </div>
        </div>
        
        <div id="alphabet-filter" class="flex flex-wrap justify-center gap-2 mb-12 slide-up" style="animation-delay: 0.2s;"></div>

        <main id="glossary-grid" class="space-y-5"></main>

        <div id="no-results" class="hidden text-center py-16">
            <p class="text-2xl secondary-text">Aucun terme trouvé.</p>
        </div>
    </div>
    
    <button id="back-to-top" class="fixed bottom-8 right-8 bg-[var(--accent-dark)] hover:bg-[var(--accent)] text-white p-3 rounded-full shadow-2xl transition-all transform hover:scale-110 focus:outline-none focus:ring-4 focus:ring-[var(--accent)] focus:ring-opacity-50">
        <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7" /></svg>
    </button>
    
    <!-- Modal pour afficher le détail d'un terme -->
    <div id="term-modal" class="fixed inset-0 bg-black bg-opacity-60 flex items-center justify-center p-4 z-50">
        <div class="glass-card rounded-2xl p-8 max-w-2xl w-full relative slide-up">
            <button id="modal-close-btn" class="absolute top-4 right-4 text-2xl secondary-text hover:text-primary">&times;</button>
            <h2 id="modal-term-transliteration" class="text-3xl font-bold mb-2" style="color: var(--accent-dark);"></h2>
            <p id="modal-term-arabic" class="arabic-term text-5xl mb-4"></p>
            <p id="modal-term-definition" class="text-lg leading-relaxed secondary-text mb-6"></p>
            <div class="flex items-center space-x-4">
                 <button id="modal-copy-btn" class="py-2 px-4 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors"><i class="fas fa-copy mr-2"></i>Copier</button>
                 <button id="modal-speak-btn" class="py-2 px-4 rounded-lg bg-gray-200 hover:bg-gray-300 transition-colors"><i class="fas fa-volume-up mr-2"></i>Écouter</button>
            </div>
        </div>
    </div>


    <script>
        const glossaryTerms = [
             { term: "أدب", transliteration: "Adab", definition: "Les bonnes manières, l'étiquette et la bienséance islamiques.", category: "Éthique", related: ["Akhlaq", "Haya'"] },
            { term: "أذان", transliteration: "Adhan", definition: "L'appel à la prière (Salah), récité publiquement pour annoncer que le temps de la prière est entré.", category: "Adoration", related: ["Salah", "Iqamah"] },
            { term: "عقيدة", transliteration: "Aqeedah", definition: "La croyance islamique, le credo. L'ensemble des articles de foi auxquels un musulman doit croire.", category: "Croyance", related: ["Iman", "Tawheed"] },
            { term: "فقه", transliteration: "Fiqh", definition: "La jurisprudence islamique. La science qui déduit les lois pratiques de l'Islam.", category: "Jurisprudence", related: ["Usul", "Madhhab"] },
            { term: "حديث", transliteration: "Hadith", definition: "Une parole, un acte, ou une approbation du Prophète Muhammad (ﷺ).", category: "Sources", related: ["Sunnah", "Isnad"] },
            { term: "إحسان", transliteration: "Ihsan", definition: "L'excellence dans l'adoration. Adorer Allah comme si on Le voyait.", category: "Spiritualité", related: ["Ikhlas", "Taqwa"] },
            { term: "جهاد", transliteration: "Jihad", definition: "Lutte, effort. La lutte intérieure (Jihad al-Nafs) ou la lutte armée (Jihad al-Qital).", category: "Concepts", related: ["Sabr", "Nafs"] },
            { term: "قرآن", transliteration: "Qur'an (Coran)", definition: "La parole d'Allah révélée au Prophète Muhammad (ﷺ).", category: "Sources", related: ["Wahy", "Ayah", "Surah"] },
            { term: "صلاة", transliteration: "Salah", definition: "La prière rituelle, un des cinq piliers de l'Islam. Cinq fois par jour.", category: "Adoration", related: ["Wudu", "Qibla", "Rak'ah"] },
            { term: "توحيد", transliteration: "Tawheed", definition: "Le monothéisme pur, l'unicité d'Allah. Le concept central de l'Islam.", category: "Croyance", related: ["Shirk", "Allah", "Rabb"] },
            { term: "زكاة", transliteration: "Zakat", definition: "L'aumône purificatrice obligatoire, un des cinq piliers de l'Islam.", category: "Adoration", related: ["Sadaqah", "Miskin"] }
        ];
        
        const glossaryGrid = document.getElementById('glossary-grid');
        const searchInput = document.getElementById('searchInput');
        const noResults = document.getElementById('no-results');
        const alphabetFilter = document.getElementById('alphabet-filter');
        const backToTopButton = document.getElementById('back-to-top');
        const randomTermBtn = document.getElementById('random-term-btn');
        
        // Modal elements
        const termModal = document.getElementById('term-modal');
        const modalCloseBtn = document.getElementById('modal-close-btn');
        const modalTransliteration = document.getElementById('modal-term-transliteration');
        const modalArabic = document.getElementById('modal-term-arabic');
        const modalDefinition = document.getElementById('modal-term-definition');
        const modalCopyBtn = document.getElementById('modal-copy-btn');
        const modalSpeakBtn = document.getElementById('modal-speak-btn');
        
        let currentTerm = {};

        glossaryTerms.sort((a, b) => a.transliteration.localeCompare(b.transliteration));

        const createTermCard = (term, index) => {
            const firstLetter = term.transliteration.charAt(0).toLowerCase();
            const isFirstOfLetter = !document.querySelector(`.term-card[data-letter='${firstLetter}']`);
            const idAttribute = isFirstOfLetter ? `id="term-${firstLetter}"` : '';

            const card = document.createElement('div');
            card.className = "term-card glass-card p-6 rounded-2xl cursor-pointer";
            card.style.animationDelay = `${index * 40}ms`;
            card.dataset.letter = firstLetter;
            if (idAttribute) card.id = `term-${firstLetter.toLowerCase()}`;
            
            card.innerHTML = `
                <div class="flex justify-between items-start mb-2">
                    <h2 class="text-2xl font-semibold" style="color: var(--accent-dark)">${term.transliteration}</h2>
                    <p class="arabic-term text-4xl">${term.term}</p>
                </div>
                <p class="leading-relaxed font-light secondary-text">${term.definition.substring(0, 100)}...</p>
                 <div class="mt-4"><span class="text-xs font-semibold inline-block py-1 px-2 uppercase rounded-full text-white bg-[var(--accent)]">${term.category}</span></div>
            `;
            
            card.addEventListener('click', () => openTermModal(term));
            return card;
        };

        const openTermModal = (term) => {
            currentTerm = term;
            modalTransliteration.textContent = term.transliteration;
            modalArabic.textContent = term.term;
            modalDefinition.textContent = term.definition;
            termModal.classList.add('active');
        };

        const closeTermModal = () => {
            termModal.classList.remove('active');
        };
        
        const displayTerms = (terms) => {
            glossaryGrid.innerHTML = '';
            if (terms.length === 0) {
                noResults.classList.remove('hidden');
            } else {
                noResults.classList.add('hidden');
                terms.forEach((term, index) => { 
                    const card = createTermCard(term, index);
                    glossaryGrid.appendChild(card);
                });
            }
        };

        const createAlphabetFilter = () => {
            alphabetFilter.innerHTML = '';
            "ABCDEFGHIJKLMNOPQRSTUVWXYZ".split('').forEach(letter => {
                const button = document.createElement('a');
                button.href = `#term-${letter.toLowerCase()}`;
                button.textContent = letter;
                button.className = 'px-3 py-1 text-sm glass-card rounded-lg hover:bg-[var(--accent)] hover:text-white transition-all duration-200 shadow-sm font-medium';
                button.onclick = (e) => {
                    e.preventDefault();
                    const targetElement = document.getElementById(`term-${letter.toLowerCase()}`);
                    if (targetElement) {
                        window.scrollTo({ top: targetElement.offsetTop - 100, behavior: 'smooth' });
                    }
                };
                alphabetFilter.appendChild(button);
            });
        };

        searchInput.addEventListener('input', (e) => {
            const searchTerm = e.target.value.toLowerCase();
            const filteredTerms = glossaryTerms.filter(term => 
                term.transliteration.toLowerCase().includes(searchTerm) || 
                term.definition.toLowerCase().includes(searchTerm) || 
                term.term.toLowerCase().includes(searchTerm) ||
                term.category.toLowerCase().includes(searchTerm));
            displayTerms(filteredTerms);
        });

        window.addEventListener('scroll', () => {
            if (window.pageYOffset > 300) {
                backToTopButton.style.display = 'block';
                requestAnimationFrame(() => { backToTopButton.style.opacity = '1'; });
            } else {
                backToTopButton.style.opacity = '0';
                setTimeout(() => { if (window.pageYOffset <= 300) backToTopButton.style.display = 'none'; }, 300);
            }
        });

        backToTopButton.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
        
        randomTermBtn.addEventListener('click', () => {
            const randomTerm = glossaryTerms[Math.floor(Math.random() * glossaryTerms.length)];
            openTermModal(randomTerm);
        });
        
        // Modal functionality
        modalCloseBtn.addEventListener('click', closeTermModal);
        termModal.addEventListener('click', (e) => {
            if (e.target === termModal) closeTermModal();
        });
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && termModal.classList.contains('active')) {
                closeTermModal();
            }
        });

        modalCopyBtn.addEventListener('click', () => {
            const textToCopy = `Terme: ${currentTerm.transliteration} (${currentTerm.term})\nDéfinition: ${currentTerm.definition}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                modalCopyBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Copié!';
                setTimeout(() => {
                    modalCopyBtn.innerHTML = '<i class="fas fa-copy mr-2"></i>Copier';
                }, 2000);
            });
        });
        
        modalSpeakBtn.addEventListener('click', () => {
            const toSpeak = new SpeechSynthesisUtterance(currentTerm.transliteration);
            toSpeak.lang = 'ar'; // Set language to Arabic for better pronunciation
            speechSynthesis.speak(toSpeak);
        });


        // Initial Display
        displayTerms(glossaryTerms);
        createAlphabetFilter();
    </script>
</body>
</html>
